services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: election-map-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: election_map
      DB_USERNAME: election_map
      DB_PASSWORD: election_map
    command: >
      npx concurrently
      "php artisan serve --host=0.0.0.0 --port=8000"
      "php artisan queue:listen --tries=1"
      "php artisan pail --timeout=0"
      "npm run dev -- --host=0.0.0.0"

  database:
    image: mariadb:lts
    container_name: election-map-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: election_map
      MARIADB_USER: election_map
      MARIADB_PASSWORD: election_map
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database-data:
