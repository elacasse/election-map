x-app-base: &app-base
    build:
        context: .
        dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/election-map
    user: "${UID}:${GID}"
    volumes:
        - .:/var/www/election-map
    environment:
        DB_CONNECTION: mysql
        DB_HOST: database
        DB_PORT: 3306
        DB_DATABASE: election_map
        DB_USERNAME: election_map
        DB_PASSWORD: election_map
    depends_on:
        database:
            condition: service_healthy

services:
    app:
        <<: *app-base
        container_name: election-map-app
        ports:
            - '8000:8000'
        command: php artisan serve --host=0.0.0.0 --port=8000

    queue:
        <<: *app-base
        container_name: election-map-queue
        command: php artisan queue:listen --tries=1

    pail:
        <<: *app-base
        container_name: election-map-pail
        command: php artisan pail --timeout=0

    vite:
        <<: *app-base
        container_name: election-map-vite
        ports:
            - '5173:5173'
        command: npm run dev -- --host=0.0.0.0

    scheduler:
        <<: *app-base
        container_name: election-map-scheduler
        command: php artisan schedule:work

    database:
        image: mariadb:lts
        container_name: election-map-db
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: election_map
            MARIADB_USER: election_map
            MARIADB_PASSWORD: election_map
            MARIADB_ROOT_PASSWORD: root
        volumes:
            - database-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    database-data:
